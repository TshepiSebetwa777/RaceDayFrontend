name: RaceDay Frontend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-containerize:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # FIXED: Removed the subfolder path, pointing directly to the root
    - name: Restore Dependencies
      run: dotnet restore ./RaceDayFrontend.csproj

    - name: Build Application
      run: dotnet build ./RaceDayFrontend.csproj -c Release --no-restore

    # FIXED: Pointed Docker straight to the root Dockerfile and context (.)
    - name: Build Docker Image
      run: docker build -t raceday-frontend:latest -f ./Dockerfile .